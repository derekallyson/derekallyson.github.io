<h1 class="fmbm_head" epub:type="title" id="ded"><a href="9780063423114_Contents.xhtml#rded">Dedication</a></h1>
<p class="cocded">To the curious, the seekers.</p>
<p class="cocded">•</p>
<p class="centers1"><i>To every dreamer I have known</i></p>
<p class="centers1"><i>may Lady Luck take you home</i></p>
<p class="centers1"><i>I pray for every wannabe</i></p>
<p class="centers1"><i>Dreamin’ big and livin’ free . . . like me.</i></p>
<p class="centers1">—Troy Jones, “Like Me”</p>
