<figcaption>

</figure>

Gainesville, Florida.</p>

</figure>

<p class="image_caption">Dale Morris believed in a couple kids who had pretty strong dreams. Celebrating with my managers Clint Higham and Dale.</p>
<p class="credit">Buffy Cooper</p>
</figcaption>
</figure>
<figure class="full70"><img alt="" role="presentation" src="../images/insert_22.jpg"/>
<figcaption>
<p class="image_caption">The night everything changed. Later that night at Coral Sky Amphitheater in West Palm Beach, Florida, I’d sign a contract with my soul.</p>
<p class="credit">Glen Rose</p>
</figcaption>
</figure>
<figure class="full80"><img alt="" role="presentation" src="../images/insert_23.jpg"/>
<figcaption>
<p class="image_caption">A rock star, a free spirit, an inspiration—but especially, Grace Potter is my friend. Even before I knew her, her voice felt like coming home.</p>
</figcaption>
</figure>

<figure class="full80"><img alt="" role="presentation" src="../images/insert_24.jpg"/>
<figcaption>
<p class="credit">Jill Trunnell</p>
</figcaption>
</figure>

</figcaption>
</figure>

<figcaption>
<p class="image_caption">Every stadium, from the beginning, I go up to the very top and sit there for a while. I measure the distance from that seat to the stage, because I know that person in the nosebleeds is the one I most want to reach. Heinz Field, Pittsburgh, Pennsylvania.</p>

</figcaption>
</figure>

<p class="credit">Helena Pygrum</p>
</figcaption>
</figure>

</figure>
<figure class="full80"><img alt="" role="presentation" src="../images/insert_33.jpg"/>

</figure>
<figure class="full80"><img alt="" role="presentation" src="../images/insert_34.jpg"/>

<figure class="full70"><img alt="" role="presentation" src="../images/insert_35.jpg"/>

</figure>
