<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive HTML5 Canvas</title>
    <style>
        /* Remove default margins and hide scrollbars to ensure a perfect fit */
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
        }

        /* Make the canvas block-level to avoid inline spacing issues */
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="myCanvas"></canvas>

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');

        // Function to resize the canvas and redraw content
        function resizeCanvas() {
            // Set the canvas drawing surface dimensions to match the window
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // Draw something on the canvas to verify it works
            drawContent();
        }

        // Function to draw a simple design centered on the screen
        function drawContent() {
            // Clear background (optional, as resizing automatically clears the canvas)
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw a centered circle
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.2, 0, Math.PI * 2);
            ctx.fillStyle = '#00adb5';
            ctx.fill();
            ctx.lineWidth = 5;
            ctx.strokeStyle = '#eeeeee';
            ctx.stroke();
        }

        // Initial resize on page load
        resizeCanvas();

        // Listen for window resize events
        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
